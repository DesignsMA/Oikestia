<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Oikestia</title>
    <meta name="description" content="Crea una cuenta en Oikestia para acceder a todas las funcionalidades y encontrar tu hogar ideal.">

    <meta name="theme-color" content="#ff6c02">

    <meta name="keywords" content="real estate, property search, home buying, apartment rentals, property listings, real estate platform, property discovery, real estate marketplace, login, sign up, user authentication, account creation, property management, real estate services, home search, property investment, real estate solutions, property search engine, real estate listings, property search platform">

    <meta name="robots" content="index, follow, all">
    
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <section class="login-section">
            <img src="./assets/images/login-bg.jpg" alt="Modern tall building black and orange.">
            <form action="/" method="POST">
                <img src="./assets/images/logo.svg" alt="Oikestia logo">
                <p>Bienvenido devuelta. Inicia sesión en tu cuenta.</p>
                <fieldset class="login-fieldset">
                    <label for="email">Email</label>
                    <div class="login-email">
                        <input type="email" id="email" name="email" placeholder="nombre@gmail.com" required>
                    </div>

                    <div>
                        <label for="password">Contraseña</label>
                        <a href="">¿Olvidaste la contraseña?</a>
                    </div>
                    <div class="login-password">
                        <input type="password" id="password" name="password" placeholder="" required>
                    </div>

                </fieldset>
                <input type="submit" value="Iniciar sesión">
            </form>
            <p>¿Aún no tienes cuenta?</p>&nbsp;<a href="sign-up.html">Crea una cuenta</a>
        </section>
    </main>    
</body>

</html>
